<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IconHub - Open Source Icon Library</title>
  <link rel="stylesheet" href="css/iconhub.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f9f9f9;
    }
    .icon-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
    }
    .icon-item {
      text-align: center;
    }
    .icon-item i {
      font-size: 24px;
      color: #333;
      display: block;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <h1>IconHub</h1>
  <p>A lightweight and customizable icon library using the `<i>` tag.</p>

  <div class="icon-preview">
    <div class="icon-item">
      <i class="icon icon-home"></i>
      <p>Home</p>
    </div>
  </div>
</body>
</html>
