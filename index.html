<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Library</title>
  <link rel="stylesheet" href="css/icon.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f9f9f9;
    }
    .icon-preview {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .icon-preview div {
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>My Icon Library</h1>
  <div class="icon-preview">
    <div>
      <i class="icon icon-home"></i>
      <p>Home</p>
    </div>
    <div>
      <i class="icon icon-search"></i>
      <p>Search</p>
    </div>
    <div>
      <i class="icon icon-user"></i>
      <p>User</p>
    </div>
  </div>
</body>
</html>
